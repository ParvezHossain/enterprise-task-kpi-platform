# Compose project name used to group containers, networks, and volumes.
name: enterprise-platform

services:
  # Shared PostgreSQL instance for the authentication, task, and KPI databases.
  postgres:
    # Pin the image by version and digest for reproducible deployments.
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped

    environment:
      # PostgreSQL initialization account.
      # Stop configuration processing if its password is missing or empty.
      POSTGRES_USER: platform_operator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup utility}

      # Credentials passed to the initialization script for separate
      # application runtime and database migration accounts.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_MIGRATION_PASSWORD: ${AUTH_DB_MIGRATION_PASSWORD}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}
      TASK_DB_MIGRATION_PASSWORD: ${TASK_DB_MIGRATION_PASSWORD}
      KPI_DB_PASSWORD: ${KPI_DB_PASSWORD}
      KPI_DB_MIGRATION_PASSWORD: ${KPI_DB_MIGRATION_PASSWORD}

    volumes:
      # Persist database data across container recreation.
      - platform-data:/var/lib/postgresql

      # Run the database initialization script when initializing an empty
      # data directory. Existing database volumes do not rerun this script.
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-platform.sh:ro

    # Check whether PostgreSQL is accepting connections.
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U platform_operator -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Central authentication server and OAuth2 token issuer.
  auth-server:
    # Build the application image from its local project directory.
    build: ./auth-server
    image: auth-server:local
    restart: unless-stopped

    # Restrict filesystem writes to temporary storage and remove Linux
    # capabilities. Prevent processes from gaining additional privileges.
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]

    # Wait for PostgreSQL readiness before starting this service.
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Enable container-specific and development configuration.
      SPRING_PROFILES_ACTIVE: docker,dev

      # Authentication database connection and runtime credentials.
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: auth_runtime
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}

      # Separate credentials for applying database migrations.
      AUTH_DB_MIGRATION_USERNAME: auth_migration
      AUTH_DB_MIGRATION_PASSWORD: ${AUTH_DB_MIGRATION_PASSWORD}

      # Public issuer URL used by clients and token validation.
      AUTH_ISSUER: http://127.0.0.1:9000

      # RSA signing key files and key identifier.
      AUTH_RSA_PRIVATE_KEY: file:/keys/private.pem
      AUTH_RSA_PUBLIC_KEY: file:/keys/public.pem
      AUTH_RSA_KEY_ID: ${AUTH_RSA_KEY_ID}

      # Hashed secrets for the task, KPI, and KPI synchronization clients.
      AUTH_TASK_CLIENT_SECRET_HASH: ${AUTH_TASK_CLIENT_SECRET_HASH}
      AUTH_KPI_CLIENT_SECRET_HASH: ${AUTH_KPI_CLIENT_SECRET_HASH}
      AUTH_KPI_SYNC_SECRET_HASH: ${AUTH_KPI_SYNC_SECRET_HASH}

    # Mount locally generated signing keys without allowing container writes.
    volumes:
      - ../.local/auth/private.pem:/keys/private.pem:ro
      - ../.local/auth/public.pem:/keys/public.pem:ro

    # Expose the authentication server only on the host's loopback interface.
    ports: [ "127.0.0.1:9000:9000" ]

    # Probe application health inside the container.
    # Allow an initial startup grace period before counting failures.
    healthcheck:
      test: [ CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:9000/actuator/health" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # Task management backend with backend-for-frontend (BFF) configuration.
  task-management:
    build: ./task-management
    image: task-management:local
    restart: unless-stopped

    # Apply container hardening and provide writable temporary storage.
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]

    # Start after the database and authentication server are healthy.
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy

    environment:
      # Enable Docker, development, and BFF configuration profiles.
      SPRING_PROFILES_ACTIVE: docker,dev,bff

      # Task database connection and runtime credentials.
      TASK_DB_URL: jdbc:postgresql://postgres:5432/task_db
      TASK_DB_USERNAME: task_runtime
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}

      # Separate credentials for applying database migrations.
      TASK_DB_MIGRATION_USERNAME: task_migration
      TASK_DB_MIGRATION_PASSWORD: ${TASK_DB_MIGRATION_PASSWORD}

      # Public issuer identity and internal endpoint for fetching
      # the authentication server's token verification keys.
      AUTH_ISSUER: http://127.0.0.1:9000
      TASK_AUTH_ISSUER: http://127.0.0.1:9000
      TASK_AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks

      # Internal authentication server address and the BFF client secret.
      BFF_AUTH_INTERNAL_URL: http://auth-server:9000
      BFF_CLIENT_SECRET: ${TASK_CLIENT_SECRET}

    # Check the task backend on its internal application port.
    healthcheck:
      test: [ CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # KPI backend with BFF configuration and task synchronization settings.
  kpi-service:
    build: ./kpi-service
    image: kpi-service:local
    restart: unless-stopped

    # Apply container hardening and provide writable temporary storage.
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]

    # Start after the database and authentication server are healthy.
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy

    environment:
      # Enable Docker, development, and BFF configuration profiles.
      SPRING_PROFILES_ACTIVE: docker,dev,bff

      # KPI database connection and runtime credentials.
      KPI_DB_URL: jdbc:postgresql://postgres:5432/kpi_db
      KPI_DB_USERNAME: kpi_runtime
      KPI_DB_PASSWORD: ${KPI_DB_PASSWORD}

      # Separate credentials for applying database migrations.
      KPI_DB_MIGRATION_USERNAME: kpi_migration
      KPI_DB_MIGRATION_PASSWORD: ${KPI_DB_MIGRATION_PASSWORD}

      # Public issuer identity and internal token verification key endpoint.
      AUTH_ISSUER: http://127.0.0.1:9000
      KPI_AUTH_ISSUER: http://127.0.0.1:9000
      KPI_AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks

      # Internal authentication server address and the BFF client secret.
      BFF_AUTH_INTERNAL_URL: http://auth-server:9000
      BFF_CLIENT_SECRET: ${KPI_CLIENT_SECRET}

      # Credentials and internal endpoints for authenticated task synchronization.
      KPI_SYNC_SECRET: ${KPI_SYNC_SECRET}
      KPI_TOKEN_URL: http://auth-server:9000/oauth2/token
      KPI_TASK_URL: http://task-management:8082

      # Synchronization interval in milliseconds; defaults to 60 seconds
      # when the environment variable is missing or empty.
      KPI_SYNC_INTERVAL_MS: ${KPI_SYNC_INTERVAL_MS:-60000}

    # Check the KPI backend on its internal application port.
    healthcheck:
      test: [ CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # Frontend service exposing the platform's local web entry points.
  frontend:
    build: ./frontend
    image: platform-frontend:local
    restart: unless-stopped

    # Apply container hardening and provide writable temporary storage.
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]

    # Wait until both application backends report healthy status.
    depends_on:
      task-management:
        condition: service_healthy
      kpi-service:
        condition: service_healthy

    # Expose both frontend ports only on the host's loopback interface.
    ports: [ "127.0.0.1:8080:8080", "127.0.0.1:8081:8081" ]

# Named persistent storage managed by Docker Compose.
volumes:
  # Stores PostgreSQL data for all platform databases.
  platform-data: