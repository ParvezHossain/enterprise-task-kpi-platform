name: enterprise-platform
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_operator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup utility}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_MIGRATION_PASSWORD: ${AUTH_DB_MIGRATION_PASSWORD}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}
      TASK_DB_MIGRATION_PASSWORD: ${TASK_DB_MIGRATION_PASSWORD}
      KPI_DB_PASSWORD: ${KPI_DB_PASSWORD}
      KPI_DB_MIGRATION_PASSWORD: ${KPI_DB_MIGRATION_PASSWORD}
    volumes:
      - platform-data:/var/lib/postgresql
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-platform.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_operator -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-server:
    build: ./auth-server
    image: auth-server:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: auth_runtime
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_MIGRATION_USERNAME: auth_migration
      AUTH_DB_MIGRATION_PASSWORD: ${AUTH_DB_MIGRATION_PASSWORD}
      AUTH_ISSUER: http://127.0.0.1:9000
      AUTH_RSA_PRIVATE_KEY: file:/keys/private.pem
      AUTH_RSA_PUBLIC_KEY: file:/keys/public.pem
      AUTH_RSA_KEY_ID: ${AUTH_RSA_KEY_ID}
      AUTH_TASK_CLIENT_SECRET_HASH: ${AUTH_TASK_CLIENT_SECRET_HASH}
      AUTH_KPI_CLIENT_SECRET_HASH: ${AUTH_KPI_CLIENT_SECRET_HASH}
      AUTH_KPI_SYNC_SECRET_HASH: ${AUTH_KPI_SYNC_SECRET_HASH}
    volumes:
      - ../.local/auth/private.pem:/keys/private.pem:ro
      - ../.local/auth/public.pem:/keys/public.pem:ro
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
  task-management:
    build: ./task-management
    image: task-management:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev,bff
      TASK_DB_URL: jdbc:postgresql://postgres:5432/task_db
      TASK_DB_USERNAME: task_runtime
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}
      TASK_DB_MIGRATION_USERNAME: task_migration
      TASK_DB_MIGRATION_PASSWORD: ${TASK_DB_MIGRATION_PASSWORD}
      AUTH_ISSUER: http://127.0.0.1:9000
      TASK_AUTH_ISSUER: http://127.0.0.1:9000
      TASK_AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      BFF_AUTH_INTERNAL_URL: http://auth-server:9000
      BFF_CLIENT_SECRET: ${TASK_CLIENT_SECRET}
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
  kpi-service:
    build: ./kpi-service
    image: kpi-service:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev,bff
      KPI_DB_URL: jdbc:postgresql://postgres:5432/kpi_db
      KPI_DB_USERNAME: kpi_runtime
      KPI_DB_PASSWORD: ${KPI_DB_PASSWORD}
      KPI_DB_MIGRATION_USERNAME: kpi_migration
      KPI_DB_MIGRATION_PASSWORD: ${KPI_DB_MIGRATION_PASSWORD}
      AUTH_ISSUER: http://127.0.0.1:9000
      KPI_AUTH_ISSUER: http://127.0.0.1:9000
      KPI_AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      BFF_AUTH_INTERNAL_URL: http://auth-server:9000
      BFF_CLIENT_SECRET: ${KPI_CLIENT_SECRET}
      KPI_SYNC_SECRET: ${KPI_SYNC_SECRET}
      KPI_TOKEN_URL: http://auth-server:9000/oauth2/token
      KPI_TASK_URL: http://task-management:8082
      KPI_SYNC_INTERVAL_MS: ${KPI_SYNC_INTERVAL_MS:-60000}
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
  frontend:
    build: ./frontend
    image: platform-frontend:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      task-management:
        condition: service_healthy
      kpi-service:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
volumes:
  platform-data:
