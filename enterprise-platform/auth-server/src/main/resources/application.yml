spring:
  application:
    name: auth-server
  profiles:
    default: local
  datasource:
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${AUTH_DB_MIGRATION_USERNAME}
    password: ${AUTH_DB_MIGRATION_PASSWORD}
    clean-disabled: true
    locations: classpath:db/migration/schema
    placeholders:
      runtimeRole: ${AUTH_DB_USERNAME}
  # Identity login is supplied by IdentityAuthenticationService.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

auth:
  signing:
    issuer: ${AUTH_ISSUER}
    private-key: ${AUTH_RSA_PRIVATE_KEY}
    public-key: ${AUTH_RSA_PUBLIC_KEY}
    key-id: ${AUTH_RSA_KEY_ID}

server:
  port: ${AUTH_SERVER_PORT:9000}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

# SQL bind/extract values and database error details can contain password hashes.
# Keep these disabled even when enabling general application DEBUG/TRACE logging.
logging:
  structured:
    format:
      console: logstash
      file: logstash
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.warn: OFF
    # Protocol TRACE and JDBC binding can expose codes, tokens and client secrets.
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://postgres:5432/auth_db}

---
# Explicit opt-in only. local/docker alone never seed reference data.
# prod takes precedence even if accidentally combined with dev or test.
spring:
  config:
    activate:
      on-profile: "(dev | test) & !prod"
  flyway:
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/dev-test
    placeholders:
      taskClientSecretHash: ${AUTH_TASK_CLIENT_SECRET_HASH}
      kpiClientSecretHash: ${AUTH_KPI_CLIENT_SECRET_HASH}
