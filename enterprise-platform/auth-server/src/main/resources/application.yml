spring:
  application:
    name: auth-server
  profiles:
    default: local
  datasource:
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${AUTH_DB_MIGRATION_USERNAME}
    password: ${AUTH_DB_MIGRATION_PASSWORD}
    clean-disabled: true
  # No users or clients are provisioned by this bootstrap.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${AUTH_SERVER_PORT:9000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://postgres:5432/auth_db}
