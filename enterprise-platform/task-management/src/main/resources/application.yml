spring:
  application:
    name: task-management
  datasource:
    url: ${TASK_DB_URL:jdbc:postgresql://localhost:5432/task_db}
    username: ${TASK_DB_USERNAME}
    password: ${TASK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${TASK_DB_MIGRATION_USERNAME}
    password: ${TASK_DB_MIGRATION_PASSWORD}
    clean-disabled: true
    locations: classpath:db/migration
    placeholders:
      runtimeRole: ${TASK_DB_USERNAME}
task:
  query:
    maximum-page-size: ${TASK_MAX_PAGE_SIZE:100}
  security:
    jwt:
      issuer: ${TASK_AUTH_ISSUER:http://localhost:9000}
      jwk-set-uri: ${TASK_AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
      audience: ${TASK_JWT_AUDIENCE:task-management}

server:
  port: ${TASK_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.warn: OFF
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO

---
spring:
  config:
    activate:
      on-profile: bff
server:
  servlet:
    session:
      cookie:
        name: TASK_SESSION
        http-only: true
        same-site: lax
        secure: ${BFF_COOKIE_SECURE:false}
bff:
  issuer: ${AUTH_ISSUER:http://localhost:9000}
  auth-internal-url: ${BFF_AUTH_INTERNAL_URL:http://localhost:9000}
  client-secret: ${BFF_CLIENT_SECRET}
  redirect-uri: ${BFF_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/task-management-ui}
