pid /tmp/nginx.pid;
worker_processes auto;
# OAuth callback query strings must never enter proxy request-error logs.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server_tokens off;
 client_max_body_size 64k;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /health { return 200 "ok"; }
  location = / { try_files /task-management-ui/index.html =404; }
  location ~ ^/(bff|oauth2|login/oauth2)/ {
   proxy_pass http://task-management:8082;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Request-ID $http_x_request_id;
   proxy_connect_timeout 2s;
   proxy_read_timeout 10s;
  }
  location / { try_files $uri =404; }
 }
 server {
  listen 8081;
  root /usr/share/nginx/html;
  location = /health { return 200 "ok"; }
  location = / { try_files /kpi-ui/index.html =404; }
  location ~ ^/(bff|oauth2|login/oauth2)/ {
   proxy_pass http://kpi-service:8083;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Request-ID $http_x_request_id;
   proxy_connect_timeout 2s;
   proxy_read_timeout 10s;
  }
  location / { try_files $uri =404; }
 }
}
