spring:
  application:
    name: kpi-service
  datasource:
    url: ${KPI_DB_URL:jdbc:postgresql://localhost:5432/kpi_db}
    username: ${KPI_DB_USERNAME}
    password: ${KPI_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${KPI_DB_MIGRATION_USERNAME}
    password: ${KPI_DB_MIGRATION_PASSWORD}
    clean-disabled: true
    locations: classpath:db/migration
    placeholders:
      runtimeRole: ${KPI_DB_USERNAME}
kpi:
  security:
    issuer: ${KPI_AUTH_ISSUER:http://localhost:9000}
    jwk-set-uri: ${KPI_AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  task-url: ${KPI_TASK_URL:http://localhost:8082}
  token-url: ${KPI_TOKEN_URL:http://localhost:9000/oauth2/token}
  sync-secret: ${KPI_SYNC_SECRET}
  sync-enabled: ${KPI_SYNC_ENABLED:true}
  sync-interval-ms: ${KPI_SYNC_INTERVAL_MS:60000}
server:
  port: ${KPI_SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.warn: OFF
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO

---
spring:
  config:
    activate:
      on-profile: bff
server:
  servlet:
    session:
      cookie:
        name: KPI_SESSION
        http-only: true
        same-site: lax
        secure: ${BFF_COOKIE_SECURE:false}
bff:
  issuer: ${AUTH_ISSUER:http://localhost:9000}
  auth-internal-url: ${BFF_AUTH_INTERNAL_URL:http://localhost:9000}
  client-secret: ${BFF_CLIENT_SECRET}
  redirect-uri: ${BFF_REDIRECT_URI:http://127.0.0.1:8081/login/oauth2/code/kpi-ui}
