name: CI and container delivery

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [auth-server, task-management, kpi-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+7'
          cache: maven
          cache-dependency-path: enterprise-platform/${{ matrix.module }}/pom.xml
      - name: Check build prerequisites
        run: |
          java -version
          mvn -version
          docker info
      - name: Verify independent Maven project
        working-directory: enterprise-platform/${{ matrix.module }}
        run: |
          if [ -f ./mvnw ]; then
            bash ./mvnw --batch-mode --no-transfer-progress clean verify
          else
            mvn --batch-mode --no-transfer-progress clean verify
          fi
      - name: Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.module }}
          path: |
            enterprise-platform/${{ matrix.module }}/target/surefire-reports/
            enterprise-platform/${{ matrix.module }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build and smoke-test Auth container
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Auth image
        run: docker build -t auth-server:ci enterprise-platform/auth-server
      - name: Verify container with disposable PostgreSQL
        run: python3 scripts/smoke-auth-container.py --image auth-server:ci
      - name: Save tested image for delivery
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: docker save --output "$RUNNER_TEMP/auth-server.tar" auth-server:ci
      - name: Transfer tested image
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-server-image
          path: ${{ runner.temp }}/auth-server.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested Auth image to GHCR
    needs: container
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: auth-server-image
          path: ${{ runner.temp }}/image
      - name: Load tested image
        run: docker load --input "$RUNNER_TEMP/image/auth-server.tar"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish commit-addressed image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/auth-server:sha-${GITHUB_SHA}"
          docker tag auth-server:ci "$image"
          docker push "$image"
          printf 'Published `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry credentials
        if: ${{ always() }}
        run: docker logout ghcr.io
